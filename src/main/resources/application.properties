spring.application.name=tks-store
server.port=8080

#server.servlet.context-path=/app
#server.address=192.168.2.2

spring.main.allow-bean-definition-overriding=true

spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/tks
spring.datasource.username=postgres
spring.datasource.password=admin
#spring.datasource.password=309927605
spring.jpa.show-sql=true
#logging.level.org.hibernate.SQL=DEBUG
spring.jpa.properties.hibernate.format_sql=false

#logging.level.org.springframework=DEBUG
#logging.level.org.apache=DEBUG

server.http.keep-alive=false

spring.servlet.multipart.enabled=true
server.tomcat.max-http-header-size=10MB
server.tomcat.connection-timeout=60s
spring.mvc.async.request-timeout=60000

server.tomcat.max-swallow-size=10MB
server.tomcat.max-http-form-post-size=10MB

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

