<div class="content" xmlns:th="http://www.w3.org/1999/xhtml" th:fragment="category">
    <div class="category_container" xmlns:th="http://www.w3.org/1999/xhtml" th:fragment="create-category">

        <a th:data-form-title="'Create'"
           th:href="'#'"
           style="display:none;"
           id="category-back"
           onclick="resetToCreateCategoryMode(this)">
            <img th:src="@{/icon/back-icon.png}" class="icon" alt="back-icon.png">
            <span style="font-size: 1.6rem;color:#000"> ត្រលប់ក្រោយ </span>
        </a>

        <div class="service-type-title">
            <img th:src="@{/icon/category-icon.png}" class="icon-service-type" alt="category-icon.png">
            <h2 id="form-modal-category-title">បញ្ជូលប្រភេទទំនិញថ្មី</h2>
        </div>

        <form id="createCategory" onsubmit="handleCategoryFormSubmit(event)">
            <div class="general-form-group" id="categoryIdFieldGroup" style="display:none;">
                <label for="category_id" class="general_label" id="category-form-ipt-id">លេខរៀង:</label>
                <input type="text" id="category_id" name="category_id" class="general_input" placeholder="លេខរៀង" readonly>
            </div>

            <div class="general-form-group">
                <label for="category_name" class="general_label">ឈ្មោះ(អង់គ្លេស):</label>
                <input type="text" id="category_name" name="category_name" class="general_input" placeholder="បញ្ជូលប្រភេទទំនិញ ជាភាសាអង់គ្លេស">
            </div>
            <div class="general-form-group">
                <label for="category_name_kh" class="general_label">ឈ្មោះ(ខ្មែរ):</label>
                <input type="text" id="category_name_kh" name="category_name_kh" class="general_input" placeholder="បញ្ជូលប្រភេទទំនិញ ជាភាសាខ្មែរ">
            </div>
            <div class="general-form-group">
                <label for="category_description" class="general_label">ពត៍មានបន្ថែម:</label>
                <textarea id="category_description" name="category_description" placeholder="ពត៍មានបន្ថែម" class="general_textarea" ></textarea>
            </div>
            <button type="submit" id="category-edit-btn" class="update_button category_create_btn_container" style="margin-right: 3%;">បញ្ជូល</button>
        </form>
    </div>
    <div class="category_table_container">
        <table class="category_table_list_container">
            <thead>
            <tr>
                <th class="table_th">លេខរៀង</th>
                <th class="table_th">ឈ្មោះ(ខ្មែរ)</th>
                <th class="table_th">ឈ្មោះ(អង់គ្លេស)</th>
                <th class="table_th">ពត៍មានបន្ថែម</th>
                <th class="table_th">ស្ថានភាព</th>
                <th class="table_th">ថ្ងៃខែបញ្ជូល</th>
                <th class="table_th">សកម្មភាព</th>
            </tr>
            </thead>
            <tbody id="categoryTable">
            <tr th:each="row, iterStat : ${content}" th:class="${iterStat.index % 2 == 0} ? '' : 'odd-row'">
                <div th:if="${content != null}">
                    <td class="table_td" th:text="${row.id}"></td>
                    <td class="table_td" th:text="${row.name}"></td>
                    <td class="table_td" th:text="${row.nameKh}"></td>
                    <td class="table_td" th:text="${row.description}"></td>
                    <td class="table_td" th:text="${row.status == 'ACTIVE' ? 'កំពុងដំណើរការ' : row.status}"></td>
                    <td class="table_td" th:text="${row.createdAt}"></td>
                    <td class="table_td">
                        <ul class="category-action">
                            <li>
                                <a th:id="${row.id}" th:href="'#'" th:onclick="'showCategoryConfirmationModal(\'delete\', ' + ${row.id} + ')'">
                                    <img th:src="@{/icon/trash.png}" class="icon" alt="Trash Icon">
                                    <span th:text="លុប"></span>
                                </a>
                            </li>
                            &nbsp;
                            <li> <span>|</span> </li>
                            &nbsp;
                            <li>
                                <a th:id="${row.id}"
                                   th:data-name="${row.name}"
                                   th:data-name-kh="${row.nameKh}"
                                   th:data-description="${row.description}"
                                   th:data-form-title="'Update'"
                                   th:href="'#'"
                                   class="category-edit-href"
                                   onclick="resetToUpdateCategoryMode(this)">
                                    <img th:src="@{/icon/edit.png}" class="icon" alt="Trash Icon">
                                    <span th:text="'កែ'"></span>
                                </a>
                            </li>
                        </ul>
                    </td>
                </div>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="category-search-bar-container">
        <input type="text" id="search_input_category" placeholder="ស្វែងរក..." onkeyup="fetchFilteredCategories()" class="category-search-ipt">

<!--        <div class="filter-date-container">-->
<!--        <label for="categoryStartDate" class="start_from">ចាប់ពី:</label>-->
<!--            <input type="date" id="categoryStartDate" onchange="categoryFilterResults()" class="date-obj">-->
<!--            <button type="button" class="clear-btn" onclick="clearCategoryStartDate()">&#10005;</button>-->
<!--        </div>-->

<!--        <div class="filter-date-container">-->
<!--        <label for="categoryEndDate" class="start_to">រហូតដល់:</label>-->
<!--            <input type="date" id="categoryEndDate" onchange="categoryFilterResults()" class="date-obj">-->
<!--            <button type="button" class="clear-btn" onclick="clearCategoryEndDate()">&#10005;</button>-->
<!--        </div>-->

    </div>

    <div id="category-confirmation-modal" class="confirm-modal" style="z-index:999">
        <div class="confirm-modal-content">
            <div class="close-confirm-modal-container">
                <span class="close-confirm-modal" onclick="closeConfirmationCategoryModal()">❌</span>
            </div>
            <div id="confirm-modal-header">
                <img th:src="@{/icon/exclamation-mark.png}"class="flex-item" alt="exclamation-mark.png" style="width: 70px; margin-left: 10%;">
                <h2 class="flex-item">សំខាន់</h2>
            </div>
            <p id="category-confirm-modal-text">Do you want to proceed with this action?</p>
            <div class="category-modal-actions">
                <button class="confirm-cancel-btn" style="font-size: 1.5rem" onclick="closeConfirmationCategoryModal()">ទេ</button>
                <button class="confirm-btn" style="font-size: 1.5rem" onclick="confirmCategoryActionConfirmation()">បាទ/ចាស់</button>
            </div>
        </div>
    </div>

    <div class="category-page-redirect">
        <div th:if="${total_records < 0}">
            <p class="unicode-icon">ទំព័រ: <span>0</span> of <span th:text="${total_pages}"></span></p>
        </div>
        <div th:unless="${total_records < 0}">
            <div th:if="${total_records == 0}">
                <p class="unicode-icon">ទំព័រ: 0</span> of <span th:text="${total_pages}"></span></p>
            </div>
            <div th:unless="${total_records == 0}">
                <div th:if="${total_records > 0}">
                    <p class="unicode-icon">ទំព័រ: <span th:text="${current_page + 1}"></span> of <span th:text="${total_pages}" ></span></p>
                </div>
            </div>
    </div>
    <div class="category-page-number">
        <div th:if="${current_page == 0}" class="category-list-prev">
            <a href="#" class="category-redirect-href"><</a>
        </div>

        <div th:if="${current_page != 0}" class="category-list-prev">
            <a th:if="${current_page > 0}" th:href="@{/api/category/list/(page=${current_page - 1})}" class="category-redirect-href"> < </a>
        </div>

        <div th:if="${current_page < total_pages}" class="category-list-next">
            <a th:if="${current_page < total_pages - 1}" th:href="@{/api/category/list/(page=${current_page + 1})}" class="category-redirect-href"> > </a>
        </div>
    </div>
 </div>
</div>
