<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TKS Store</title>

    <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@100..900&family=Battambang:wght@100;300;400;700;900&family=Changa:wght@200..800&family=Concert+One&family=Lexend+Deca:wght@100..900&family=Pridi:wght@200;300;400;500;600;700&family=Protest+Strike&family=Sofia+Sans+Condensed:ital,wght@0,1..1000;1,1..1000&display=swap" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" th:href="@{/css/homepage.css}">
    <link rel="stylesheet" th:href="@{/css/header.css}">
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/product.css}">
    <link rel="stylesheet" th:href="@{/css/product-tab-modal.css}">
    <link rel="stylesheet" th:href="@{/css/category.css}">
    <link rel="stylesheet" th:href="@{/css/attribute.css}">

    <script th:src="@{/js/date.js}" type="text/javascript" defer></script>
    <script th:src="@{/js/category.js}" type="text/javascript" defer></script>
    <script th:src="@{/js/attribute.js}" type="text/javascript" defer></script>
    <script th:src="@{/js/product.js}" type="text/javascript" defer></script>
    <script th:src="@{/js/common.js}" type="text/javascript" defer></script>

    <script th:src="@{/js/api/product-api.js}" type="text/javascript" defer></script>
</head>
    <body>
        <div th:replace="fragments/sidebar :: sidebar"></div>
        <div th:replace="fragments/header :: header"></div>
        <div id="pop_up_message" class="pop-up-message"></div>
        <!-- Content -->
        <div class="main-body">
            <div th:switch="${page_type_en}">

                <div th:case="'product'">
                    <div th:replace="fragments/product :: product"></div>
                </div>

                <div th:case="'category'">
                    <div th:replace="fragments/category :: category"></div>
                </div>

                <div th:case="'attribute'">
                    <div th:replace="fragments/attribute :: attribute"></div>
                </div>
            </div>
        </div>
    </body>
</html>
