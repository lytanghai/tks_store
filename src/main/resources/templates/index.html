<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Category</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@100..900&family=Battambang:wght@100;300;400;700;900&family=Changa:wght@200..800&family=Concert+One&family=Lexend+Deca:wght@100..900&family=Pridi:wght@200;300;400;500;600;700&family=Protest+Strike&family=Sofia+Sans+Condensed:ital,wght@0,1..1000;1,1..1000&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@100..900&family=Battambang:wght@100;300;400;700;900&family=Changa:wght@200..800&family=Concert+One&family=Lexend+Deca:wght@100..900&family=Pridi:wght@200;300;400;500;600;700&family=Protest+Strike&family=Sofia+Sans+Condensed:ital,wght@0,1..1000;1,1..1000&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/homepage.css}">
    <link rel="stylesheet" th:href="@{/css/header.css}">
    <style>
/* Modal Styling */
.modal {
    display: none;
    position: fixed;
    z-index: 1;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0,0,0,0.4);
    padding-top: 60px;
}

.modal-content {
    background-color: #fefefe;
    margin: 5% auto;
    padding: 20px;
    border: 1px solid #888;
    width: 80%;
    max-width: 500px;
    text-align: center;
    border-radius: 8px;
}

.close {
    color: #aaa;
    float: right;
    font-size: 28px;
    font-weight: bold;
}

.close:hover,
.close:focus {
    color: black;
    cursor: pointer;
}

.modal-actions {
    margin-top: 20px;
}

.modal-actions button {
    padding: 10px 20px;
    margin: 0 10px;
    font-size: 16px;
    border: none;
    cursor: pointer;
    border-radius: 4px;
}

.confirm-btn {
    background-color: #4CAF50;
    color: white;
}

.cancel-btn {
    background-color: #f44336;
    color: white;
}

.confirm-btn:hover {
    background-color: #45a049;
}

.cancel-btn:hover {
    background-color: #e41c21;
}

/* Form Styling */
.product-form {
    padding: 20px;
    margin-top: 20px;
}

.category_form-group {
    margin-bottom: 15px;
}

.category_label {
    font-weight: bold;
    display: block;
    margin-bottom: 5px;
}

.category_input,
.category_textarea {
    width: 100%;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 4px;
}

.category_textarea {
    height: 100px;
}

/* Buttons */
.update_button {
    padding: 10px 20px;
    background-color: #4CAF50;
    color: white;
    border: none;
    cursor: pointer;
    border-radius: 4px;
}

.update_button:hover {
    background-color: #45a049;
}


    </style>
</head>
<body>
<!-- Trigger Buttons -->
<button type="button" onclick="showModal('create')">Create Product</button>
<button type="button" onclick="showModal('update')">Update Product</button>
<button type="button" onclick="showModal('delete')">Delete Product</button>

<!-- Modal Structure -->
<div id="myModal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeModal()">&times;</span>
        <h2>Are you sure?</h2>
        <p id="modalText">Do you want to proceed with this action?</p>
        <div class="modal-actions">
            <button class="cancel-btn" onclick="closeModal()">No</button>
            <button class="confirm-btn" onclick="confirmAction()">Yes</button>
        </div>
    </div>
</div>

<!-- Form to Create / Update Product -->
<div id="productForm" class="product-form">
    <form id="popupForm" class="pop-up" onsubmit="submitForm(event)">
        <div class="category_form-group">
            <label for="id_edit" class="category_label">ID:</label>
            <input type="text" id="id_edit" name="id" class="category_input ready-only-field" placeholder="ID" readonly>
        </div>
        <div class="category_form-group">
            <label for="name_en_edit" class="category_label">Name (English):</label>
            <input type="text" id="name_en_edit" name="name_en" class="category_input" placeholder="Enter Product Name in English">
        </div>
        <div class="category_form-group">
            <label for="name_kh_edit" class="category_label">Name (Khmer):</label>
            <input type="text" id="name_kh_edit" name="name_kh" class="category_input" placeholder="Enter Product Name in Khmer">
        </div>
        <div class="category_form-group">
            <label for="sale_price_edit" class="category_label">Price:</label>
            <input type="text" id="sale_price_edit" name="sale_price" class="category_input" placeholder="Enter Price">
        </div>
        <div class="category_form-group">
            <label for="currency_edit" class="category_label">Currency:</label>
            <input type="text" id="currency_edit" name="currency" class="category_input" placeholder="Enter Currency">
        </div>
        <div class="category_form-group">
            <label for="description_edit" class="category_label">Description:</label>
            <textarea id="description_edit" name="description" placeholder="Additional Information" class="category_textarea"></textarea>
        </div>
        <div class="category_form-group">
            <label for="category_select" class="category_label">Category:</label>
            <select id="category_select" name="category_id" class="category_input">
                <!-- Categories will be populated here -->
            </select>
        </div>
        <button type="submit" class="update_button" id="category-edit-btn">Submit</button>
    </form>
</div>

<script>
    // Show Modal
function showModal(action) {
    document.getElementById("myModal").style.display = "block";
    const modalText = document.getElementById("modalText");

    // Customize modal text based on the action
    if (action === 'create') {
        modalText.textContent = 'Are you sure you want to create a new product?';
    } else if (action === 'update') {
        modalText.textContent = 'Are you sure you want to update this product?';
    } else if (action === 'delete') {
        modalText.textContent = 'Are you sure you want to delete this product?';
    }

    // Store action for later use
    window.currentAction = action;
}

// Close Modal
function closeModal() {
    document.getElementById("myModal").style.display = "none";
}

// Confirm Action (Create, Update, Delete)
function confirmAction() {
    if (window.currentAction === 'create') {
        alert('Creating product...');
    } else if (window.currentAction === 'update') {
        alert('Updating product...');
    } else if (window.currentAction === 'delete') {
        alert('Deleting product...');
    }
    closeModal();
}

// Fetch Categories and Populate the Select Dropdown
function fetchCategories() {
    fetch('/category/list/v2')
        .then(response => response.json())
        .then(data => {
            const select = document.getElementById("category_select");
            data.forEach(category => {
                const option = document.createElement("option");
                option.value = category.id;
                option.text = category.name;
                select.appendChild(option);
            });
        })
        .catch(error => console.error('Error fetching categories:', error));
}

// Populate Categories when the page loads
window.onload = function() {
    fetchCategories();
}

// Handle Form Submission for Create/Update Product
function submitForm(event) {
    event.preventDefault();

    const form = document.getElementById("popupForm");
    const formData = new FormData(form);
    const productData = {};

    formData.forEach((value, key) => {
        productData[key] = value;
    });

    if (window.currentAction === 'create') {
        alert('Product Created: ' + JSON.stringify(productData));
    } else if (window.currentAction === 'update') {
        alert('Product Updated: ' + JSON.stringify(productData));
    }

    closeModal(); // Close the modal after action
}

</script>
</body>
</html>
