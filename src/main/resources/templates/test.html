<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Category</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@100..900&family=Battambang:wght@100;300;400;700;900&family=Changa:wght@200..800&family=Concert+One&family=Lexend+Deca:wght@100..900&family=Pridi:wght@200;300;400;500;600;700&family=Protest+Strike&family=Sofia+Sans+Condensed:ital,wght@0,1..1000;1,1..1000&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@100..900&family=Battambang:wght@100;300;400;700;900&family=Changa:wght@200..800&family=Concert+One&family=Lexend+Deca:wght@100..900&family=Pridi:wght@200;300;400;500;600;700&family=Protest+Strike&family=Sofia+Sans+Condensed:ital,wght@0,1..1000;1,1..1000&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/homepage.css}">
    <link rel="stylesheet" th:href="@{/css/header.css}">
    <style>
/* Modal Styling */
.confirm-modal {
    display: none;
    position: fixed;
    z-index: 1;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0,0,0,0.4);
    padding-top: 60px;
}

.confirm-modal-content {
    background-color: #fefefe;
    margin: 5% auto;
    padding: 20px;
    border: 1px solid #888;
    width: 80%;
    max-width: 500px;
    text-align: center;
    border-radius: 8px;
}

.close-confirm-modal {
    color: #aaa;
    float: right;
    font-size: 28px;
    font-weight: bold;
}

.close-confirm-modal:hover,
.close-confirm-modal:focus {
    color: black;
    cursor: pointer;
}

.modal-actions {
    margin-top: 20px;
}

.modal-actions button {
    padding: 10px 20px;
    margin: 0 10px;
    font-size: 16px;
    border: none;
    cursor: pointer;
    border-radius: 4px;
}

.confirm-btn {
    background-color: #4CAF50;
    color: white;
}

.confirm-cancel-btn {
    background-color: #f44336;
    color: white;
}

.confirm-btn:hover {
    background-color: #45a049;
}

.confirm-cancel-btn:hover {
    background-color: #e41c21;
}


    </style>
</head>
<body>
<!-- Trigger Buttons -->
<button type="button" onclick="showConfirmationModal('create')">Create Product</button>
<button type="button" onclick="showConfirmationModal('update')">Update Product</button>
<button type="button" onclick="showConfirmationModal('delete')">Delete Product</button>

<!-- Modal Structure -->
<div id="confirmation-modal" class="confirm-modal">
    <div class="confirm-modal-content">
        <span class="close-confirm-modal" onclick="closeConfirmationModal()">&times;</span>
        <h2>Are you sure?</h2>
        <p id="confirm-modal-text">Do you want to proceed with this action?</p>
        <div class="modal-actions">
            <button class="confirm-btn" onclick="confirmActionConfirmation()">Yes</button>
            <button class="confirm-cancel-btn" onclick="closeConfirmationModal()">No</button>
        </div>
    </div>
</div>

<script>

    function showConfirmationModal(action) {
        document.getElementById("confirmation-modal").style.display = "block";
        const modalText = document.getElementById("confirm-modal-text");

        // Customize modal text based on the action
        if (action === 'create') {
            modalText.textContent = 'Are you sure you want to create a new product?';
        } else if (action === 'update') {
            modalText.textContent = 'Are you sure you want to update this product?';
        } else if (action === 'delete') {
            modalText.textContent = 'Are you sure you want to delete this product?';
        }

        // Store action for later use
        window.currentAction = action;
    }

    function closeConfirmationModal() {
        document.getElementById("confirmation-modal").style.display = "none";
    }

    function confirmActionConfirmation() {
        if (window.currentAction === 'create') {
            alert('Creating product...');
        } else if (window.currentAction === 'update') {
            alert('Updating product...');
        } else if (window.currentAction === 'delete') {
            alert('Deleting product...');
        }
        closeConfirmationModal();
    }


</script>
</body>
</html>
